[package]
name = "sgcap"
version = "0.1.0"
edition = "2021"
description = "macOS-style screen capture for Windows: hotkey, region selection, draggable thumbnail, auto-save"
license = "MIT"
repository = "https://github.com/sebastienguillon/sg-cap"
readme = "README.md"
build = "build.rs"

[[bin]]
name = "sgcap"
path = "src/main.rs"

[dependencies]
png = "0.18"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_Security",
]

[build-dependencies]
embed-manifest = "1.5"

# Dev builds: light optimisation so pixel loops are usable, deps optimised.
[profile.dev]
opt-level = 1
panic = "abort"
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = true
debug = false
